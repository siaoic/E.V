[plugin]
enabled = true
config_version = "0.1.0"

[pvz]
# 游戏窗口标题（精确匹配）。找不到窗口插件会拒绝加载。
window_title = "植物大战僵尸"
# 模板与区域坐标的基准分辨率 [宽, 高]：templates/ 里的模板截图必须在这个
# 窗口尺寸下截取；运行时按实际窗口尺寸等比缩放。
base_resolution = [800, 600]

# ——以下区域坐标均为【基准分辨率】坐标系下的 [x, y, w, h]，需实机标定——
# 草坪每行区域（自上而下 5 行），用于「每行是否有僵尸」的差分检测。
lawn_rows = [
    [45, 90, 690, 78],
    [45, 168, 690, 78],
    [45, 246, 690, 78],
    [45, 324, 690, 78],
    [45, 402, 690, 78],
]
# 卡片槽区域（从左到右），用于冷却状态判定与种植定位。
card_slots = [
    [60, 8, 50, 70],
    [113, 8, 50, 70],
    [166, 8, 50, 70],
    [219, 8, 50, 70],
    [272, 8, 50, 70],
    [325, 8, 50, 70],
    [378, 8, 50, 70],
    [431, 8, 50, 70],
    [484, 8, 50, 70],
    [537, 8, 50, 70],
]
# 阳光数字显示区，用于阳光数识别。
sun_region = [10, 90, 40, 30]
# 草坪网格左上角格心 [x, y] 与间距 [w, h]，用于种植/铲除定位。
grid_origin = [60, 100]
grid_cell = [76, 78]

# 廉价帧差阈值（64x64 平均绝对差，0~255）：静止画面不触发完整识别。
diff_threshold = 2.5
# 判定某行有僵尸的差分强度阈值。
row_threshold = 6.0
# 卡片就绪的亮度阈值（冷却中的卡片偏暗）。
card_ready_brightness = 110.0
# 动作点击后等待画面响应的时长（秒）。
action_settle_seconds = 0.4

# 世界机器名，全局唯一；AI 调用 world_observe 时用它定位本世界。
name = "pvz"
display_name = "植物大战僵尸"
env_prompt = "你正在植物大战僵尸的游戏窗口前做直播解说与操作。画面阶段、阳光数、每行是否有僵尸、卡片冷却会作为世界状态注入；只有画面变化时状态才会刷新。你可以用 pvz_plant 种植、pvz_collect 收阳光、pvz_shovel 铲除植物，动作提交后真实结果会以世界事件回传；游戏窗口不在前台时动作会被拒绝。"
