name: live_dy
description: 抖音直播模式。
version: 5.0

extends: live_bili.yaml      # 大部分相同，只覆写 danmaku 槽位 + 插件

plugins:
  builtin:
    - echo_llm
    - avatar_xiaoyuanzi_local
    - danmaku_douyin         # 占位：与 danmaku_bilibili 结构一致，真实插件化时替换
    - danmaku_filter
    - memory_long
    - emotion_rule
    - proactive_tick
  pypi: []
  git: []

slots:
  model: echo-default
  tts: null
  avatar: xiaoyuanzi-local
  input: douyin-danmaku
  danmaku: douyin
  memory: longterm
  emotion: rule-based
  proactive: ticker

plugin_config:
  danmaku_douyin:
    impl_name: douyin
    room_id: ${DY_ROOM_ID:-}
    cookie: ${DY_COOKIE:-}
  # 其他配置（memory / proactive / tts / emotion）继承 live_bili.yaml → resolve extends 自动生效
