name: live_bili
description: B站直播模式。以 B 站弹幕为唯一输入源。
version: 5.0

plugins:
  builtin:
    - echo_llm
    - tts_edge
    - avatar_xiaoyuanzi_local
    - danmaku_bilibili
    - danmaku_filter
    - memory_long
    - emotion_rule
    - proactive_tick
  pypi: []
  git: []

slots:
  model: echo-default
  tts: edge
  avatar: xiaoyuanzi-local
  input: bilibili-danmaku      # 让 danmaku_bilibili 作为 input 源（同时注册到 danmaku + input）
  danmaku: bilibili
  memory: longterm
  emotion: rule-based
  proactive: ticker
  mcp: null
  butler: null
  evolution: null

plugin_config:
  danmaku_bilibili:
    impl_name: bilibili
    room_id: ${BILI_ROOM_ID:-0}
    sessdata: ${BILI_SESSDATA:-}
    buvid3: ${BILI_BUVID3:-}
  danmaku_filter:
    min_length: 2
    blacklist:
      - "签到"
      - "前排"
    allow_gifts: true
  memory_long:
    impl_name: longterm
    top_k: 8
  proactive_tick:
    impl_name: ticker
    interval_sec: 120
    prefix: "自言自语："
