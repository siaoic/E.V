name: pet
description: 桌宠模式（单机 1v1）。本地 LLM + 本地 TTS + Avatar，无需弹幕/外部账号。
version: 5.0

plugins:
  builtin:
    - echo_llm                  # 占位：真实接入时替换为 llm_deepseek / llm_chatglm_local 等
    - tts_edge                  # TTS：Edge TTS（免费）
    - avatar_xiaoyuanzi_local   # Avatar：小院子本地化（或 VTS）
    - input_cli                 # Input：命令行交互
    - emotion_rule              # Emotion：规则映射
  pypi: []
  git: []

slots:
  model: echo-default
  tts: edge
  avatar: xiaoyuanzi-local
  input: cli
  memory: null
  emotion: rule-based
  proactive: null
  mcp: null
  butler: null
  evolution: null
  scheduler: null
  sandbox: null
  danmaku: null

plugin_config:
  echo_llm:
    prefix: "[Pet] "
    impl_name: echo-default
  tts_edge:
    voice: zh-CN-XiaoxiaoNeural
    impl_name: edge
    rate: "+0%"
    volume: "+0%"
  avatar_xiaoyuanzi_local:
    impl_name: xiaoyuanzi-local
    host: 127.0.0.1
    port: 8765
  input_cli:
    prompt: "[Pet] > "
    impl_name: cli
  emotion_rule:
    impl_name: rule-based
