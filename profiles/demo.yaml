# E.V 5.0 Demo 机器人 Profile
# 用法 1（脚本）：Kernel(profile="demo").boot()
# 用法 2（Sprint4 CLI）：ev run --profile demo
name: demo
description: 最小化演示 profile。内建 echo_llm + 空的 slot 配置（不连接外部服务）。
version: 5.0

plugins:
  builtin:
    # Echo LLM（SlotName.model 槽位，impl_name=echo-default）
    - echo_llm
  pypi: []
  git: []

slots:
  # slots.<slot_enum.value> = <impl_name>  —— 这里的 key 必须和 SlotName 枚举的 value 一致
  model: echo-default        # LLM 槽位：激活 echo-default
  # 以下槽位演示用，显式置 null（或直接省略键）表示不激活，等以后接入真实插件再填
  tts: null
  avatar: null
  input: null
  danmaku: null
  memory: null
  emotion: null
  proactive: null
  mcp: null
  butler: null
  evolution: null
  scheduler: null
  sandbox: null
  ui: null
  pet: null
  session: null
  credentials: null

plugin_config:
  echo_llm:
    prefix: "[Echo Demo] "
    impl_name: "echo-default"
