<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投票弹窗 · 弹幕风格</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ink: rgba(255, 255, 255, 0.98);
            --ink-soft: rgba(255, 255, 255, 0.94);
            --ink-dim: rgba(255, 255, 255, 0.72);
            --line: rgba(255, 255, 255, 0.56);
            --line-soft: rgba(255, 255, 255, 0.34);
            --line-faint: rgba(255, 255, 255, 0.18);
            --shadow: 0 1px 2px rgba(0,0,0,0.98), 0 0 6px rgba(0,0,0,0.92), 0 3px 12px rgba(0,0,0,0.78);
            --font: "XiaoKeNaiLaoTiShangYongMianFei", "Source Han Serif CN", "Source Han Serif SC",
                    "Noto Serif SC", "Songti SC", "SimSun", "MingLiU", "PMingLiU", serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font) !important;
        }
        html, body {
            background: transparent;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* ===== 投票弹窗 — 弹幕卡片暗色风格 ===== */
        .vote-popup {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 360px;
            max-width: 92vw;
            background: linear-gradient(135deg, rgba(0,0,0,0.72), rgba(0,0,0,0.52) 60%, rgba(0,0,0,0.38));
            border-top: 1px solid rgba(255,255,255,0.86);
            border-bottom: 1px solid rgba(255,255,255,0.34);
            border-left: 1px solid rgba(255,255,255,0.42);
            border-right: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.06);
            z-index: 999;
            transform: translateX(calc(100% + 40px));
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.22, 0.8, 0.3, 1), opacity 0.4s ease;
            pointer-events: none;
            overflow: visible;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .vote-popup.active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }
        /* 左上角装饰缺口（参考弹幕卡片 dc-card::before） */
        .vote-popup::before {
            content: "";
            position: absolute;
            top: -4px;
            left: 20px;
            width: 52px;
            height: 7px;
            border-left: 1px solid rgba(255,255,255,0.7);
            border-right: 1px solid rgba(255,255,255,0.7);
            pointer-events: none;
            z-index: 2;
        }
        /* 报头 */
        .vote-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 20px 12px;
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.46);
            position: relative;
            z-index: 1;
        }
        .vote-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .vote-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--ink);
            border: 1px solid rgba(255,255,255,0.56);
            outline: 1px solid rgba(255,255,255,0.22);
            outline-offset: 2px;
            text-shadow: var(--shadow);
        }
        .vote-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.18em;
            text-shadow: var(--shadow);
        }
        /* 主体 */
        .vote-body {
            padding: 20px 22px 18px;
            color: var(--ink);
            position: relative;
            z-index: 1;
            background: transparent;
        }
        .vote-question {
            position: relative;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 18px;
            padding: 4px 0 4px 14px;
            border-left: 1px solid rgba(255,255,255,0.58);
            color: var(--ink);
            letter-spacing: 0.02em;
            text-shadow: var(--shadow);
        }
        /* 问题上方短装饰线 */
        .vote-question::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.84), transparent);
        }
        /* 选项 + 进度条 */
        .vote-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 4px;
        }
        .vote-option {
            cursor: pointer;
            transition: 0.2s;
        }
        .vote-option .opt-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.22);
            padding: 9px 14px 9px 10px;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
            position: relative;
        }
        .vote-option:hover .opt-row {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.56);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .vote-option:active .opt-row {
            background: rgba(255,255,255,0.12);
        }
        .vote-option .opt-letter {
            width: 26px;
            height: 26px;
            background: rgba(255,255,255,0.06);
            color: var(--ink);
            text-align: center;
            line-height: 24px;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.42);
            text-shadow: var(--shadow);
            letter-spacing: 0;
        }
        .vote-option .opt-text {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--ink-soft);
            text-shadow: var(--shadow);
        }
        .vote-option .opt-percent {
            font-weight: 700;
            font-size: 15px;
            color: var(--ink);
            min-width: 44px;
            text-align: right;
            text-shadow: var(--shadow);
            letter-spacing: 0.02em;
        }
        /* 进度条 */
        .vote-option .opt-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin-top: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .vote-option .opt-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.6));
            transition: width 0.45s cubic-bezier(0.22, 0.8, 0.3, 1);
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
        /* 选中高亮 */
        .vote-option.selected .opt-row {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.78);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 0 12px rgba(255,255,255,0.08);
        }
        .vote-option.selected .opt-letter {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.78);
        }
        .vote-option.selected .opt-bar-fill {
            background: linear-gradient(90deg, #fff, rgba(255,255,255,0.7));
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        /* Toast 提示 */
        .vote-toast {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.42);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-soft);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.25s ease, bottom 0.25s ease;
            pointer-events: none;
            letter-spacing: 0.04em;
            text-shadow: var(--shadow);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .vote-toast.show {
            opacity: 1;
            bottom: 120px;
        }
        /* 减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
        @media (max-width: 500px) {
            .vote-popup {
                top: 16px;
                right: 12px;
                width: 92vw;
                max-width: 360px;
            }
            .vote-question {
                font-size: 18px;
            }
            .vote-option .opt-text {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== 投票弹窗 ===== -->
    <div class="vote-popup" id="votePopup">
        <div class="vote-header">
            <div class="vote-header-left">
                <span class="vote-icon">
                    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                        <path d="M256.410578 940.384405H91.122722c-15.462716 0-27.999168-12.536452-27.999168-27.999168v-592.645304c0-15.462716 12.536452-27.999168 27.999168-27.999168h165.287856c15.462716 0 27.999168 12.536452 27.999168 27.999168v592.645304c0 15.462716-12.536452 27.999168-27.999168 27.999168zM119.12189 884.386069h109.28952V347.740125H119.12189v536.645944zM595.723103 940.384405H430.435247c-15.462716 0-27.999168-12.536452-27.999168-27.999168V500.341018c0-15.462716 12.536452-27.999168 27.999168-27.999168h165.287856c15.462716 0 27.999168 12.536452 27.999168 27.999168v412.044219c0 15.462716-12.536452 27.999168-27.999168 27.999168z m-137.288688-55.998336h109.28952v-356.045883h-109.28952v356.045883zM928.92508 940.384405H763.62289c-15.462716 0-27.999168-12.536452-27.999168-27.999168V111.852305c0-15.462716 12.536452-27.999168 27.999168-27.999169h165.30219c15.462716 0 27.999168 12.536452 27.999168 27.999169v800.533956c0 15.461692-12.537476 27.998144-27.999168 27.998144z m-137.303022-55.998336h109.303854V139.851473H791.622058v744.534596z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="vote-title">弹幕投票</span>
            </div>
        </div>
        <div class="vote-body">
            <div class="vote-question">秋日甜香 · 你选哪一味？</div>
            <div class="vote-options" id="voteOptions">
                <!-- 选项A -->
                <div class="vote-option" data-value="A">
                    <div class="opt-row">
                        <span class="opt-letter">A</span>
                        <span class="opt-text">焦糖栗子</span>
                        <span class="opt-percent" id="percentA">0%</span>
                    </div>
                    <div class="opt-bar-bg"><div class="opt-bar-fill" id="barA" style="width:0%;"></div></div>
                </div>
                <!-- 选项B -->
                <div class="vote-option" data-value="B">
                    <div class="opt-row">
                        <span class="opt-letter">B</span>
                        <span class="opt-text">肉桂南瓜</span>
                        <span class="opt-percent" id="percentB">0%</span>
                    </div>
                    <div class="opt-bar-bg"><div class="opt-bar-fill" id="barB" style="width:0%;"></div></div>
                </div>
                <!-- 选项C -->
                <div class="vote-option" data-value="C">
                    <div class="opt-row">
                        <span class="opt-letter">C</span>
                        <span class="opt-text">烤红薯</span>
                        <span class="opt-percent" id="percentC">0%</span>
                    </div>
                    <div class="opt-bar-bg"><div class="opt-bar-fill" id="barC" style="width:0%;"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="vote-toast" id="voteToast">已记录你的选择</div>
    <script>
        (function() {
            // ----- DOM refs -----
            const popup = document.getElementById('votePopup');
            const options = document.querySelectorAll('.vote-option');
            const toast = document.getElementById('voteToast');
            const percentA = document.getElementById('percentA');
            const percentB = document.getElementById('percentB');
            const percentC = document.getElementById('percentC');
            const barA = document.getElementById('barA');
            const barB = document.getElementById('barB');
            const barC = document.getElementById('barC');
            // ----- 投票数据 (模拟弹幕计数) -----
            let votes = { A: 0, B: 0, C: 0 };
            let selectedValue = null;
            let hasVoted = false;
            // ----- 更新百分比 & 进度条 -----
            function updatePercentages() {
                const total = votes.A + votes.B + votes.C;
                if (total === 0) {
                    percentA.textContent = '0%';
                    barA.style.width = '0%';
                    percentB.textContent = '0%';
                    barB.style.width = '0%';
                    percentC.textContent = '0%';
                    barC.style.width = '0%';
                    return;
                }
                const pA = Math.round((votes.A / total) * 100);
                const pB = Math.round((votes.B / total) * 100);
                const pC = Math.round((votes.C / total) * 100);
                percentA.textContent = pA + '%';
                barA.style.width = pA + '%';
                percentB.textContent = pB + '%';
                barB.style.width = pB + '%';
                percentC.textContent = pC + '%';
                barC.style.width = pC + '%';
            }
            // ----- 外部调用：增加票数 (由左侧弹幕流触发) -----
            window.addVote = function(optionKey) {
                if (!votes.hasOwnProperty(optionKey)) return;
                votes[optionKey] = (votes[optionKey] || 0) + 1;
                updatePercentages();
                if (popup.classList.contains('active')) {
                    showToast('收到 ' + optionKey + ' 票', 600);
                }
            };
            // ----- 清除选中高亮 -----
            function clearSelected() {
                options.forEach(el => el.classList.remove('selected'));
                selectedValue = null;
            }
            // ----- 选择选项 -----
            function selectOption(value) {
                if (hasVoted) {
                    showToast('你已经投过票啦', 1400);
                    return;
                }
                clearSelected();
                options.forEach(el => {
                    if (el.dataset.value === value) {
                        el.classList.add('selected');
                        selectedValue = value;
                    }
                });
            }
            // ----- Toast -----
            function showToast(msg, duration = 1200) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }
            // ----- 弹窗控制 -----
            function closePopup() {
                popup.classList.remove('active');
            }
            function openPopup() {
                popup.classList.add('active');
                updatePercentages();
                if (hasVoted) {
                    options.forEach(el => {
                        el.style.cursor = 'default';
                        el.style.opacity = '0.7';
                    });
                } else {
                    options.forEach(el => {
                        el.style.cursor = 'pointer';
                        el.style.opacity = '1';
                    });
                }
            }
            // 对外暴露弹窗控制
            window.openVotePopup = openPopup;
            window.closeVotePopup = closePopup;
            // ----- 事件绑定 -----
            options.forEach(opt => {
                opt.addEventListener('click', function() {
                    const val = this.dataset.value;
                    selectOption(val);
                });
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && popup.classList.contains('active')) {
                    closePopup();
                }
            });
            // ----- 模拟初始票数 (展示效果) -----
            setTimeout(() => {
                window.addVote('A');
                window.addVote('B');
                window.addVote('A');
                window.addVote('C');
                window.addVote('B');
                window.addVote('A');
                updatePercentages();
            }, 300);
            // 自动打开弹窗
            setTimeout(() => {
                openPopup();
                showToast('投票已开启', 1500);
            }, 600);
            // 暴露 updatePercentages 供外部调用
            window.updateVotePercentages = updatePercentages;
        })();
    </script>
</body>
</html>
