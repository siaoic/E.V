<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暖色重构 · 焦糖栗子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, 'Times New Roman', 'STSong', 'SimSun', serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            position: relative;
        }

        /* 状态指示 — 编辑部通讯标签 */
        .status-bar {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px 7px 11px;
            border-radius: 0;
            background: #fdfdfb;
            backdrop-filter: none;
            border: 2px solid #5e2c2c;
            box-shadow: 4px 4px 0 #5e2c2c;
            color: #5e2c2c;
            font-size: 11px;
            font-weight: 700;
            z-index: 300;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #decfc7;
            transition: 0.3s;
            border: 1.5px solid #5e2c2c;
        }
        .status-dot.ok {
            background: #9bc08a;
            box-shadow: none;
            animation: pulse 1.4s infinite;
        }
        .status-dot.bad {
            background: #e8a4a4;
            box-shadow: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.85); }
        }

        /* 输入区 — 通讯电报栏 */
        .input-area {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0;
            z-index: 200;
            background: #fdfdfb;
            backdrop-filter: none;
            padding: 0;
            border-radius: 0;
            border: 2px solid #5e2c2c;
            box-shadow: 5px 5px 0 #5e2c2c, 0 0 30px rgba(180, 5, 5, 0.2);
            width: 90%;
            max-width: 500px;
        }
        #danmakuInput {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border-radius: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #5e2c2c;
            font-weight: 400;
            letter-spacing: 0.3px;
            min-width: 0;
            font-family: Georgia, 'Times New Roman', 'STSong', serif;
            border-right: 2px solid #5e2c2c;
        }
        #danmakuInput::placeholder {
            color: rgba(44, 58, 94, 0.4);
            font-weight: 400;
            font-style: italic;
        }
        #sendBtn {
            padding: 0 28px;
            background: #5e2c2c;
            color: #fdfdfb;
            border: none;
            border-radius: 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            transition: 0.15s;
            box-shadow: none;
            white-space: nowrap;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
        }
        #sendBtn:hover {
            transform: translate(-1px, -1px);
            background: #e8a4a4;
            box-shadow: 2px 2px 0 #5e2c2c;
            color: #5e2c2c;
        }
        #sendBtn:active {
            transform: translate(2px, 2px);
            background: #c98888;
            color: #5e2c2c;
        }

        /* ===== 左侧实时弹幕流 — 编辑部收报栏 ===== */
        #feedPanel {
            position: fixed;
            left: 16px;
            top: 90px;
            bottom: 90px;
            width: 270px;
            z-index: 150;
            background: rgba(253, 253, 251, 0.94);
            border: 2px solid #5e2c2c;
            box-shadow: 5px 5px 0 #5e2c2c;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #feedHeader {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            background: #5e2c2c;
            color: #fdfdfb;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        #feedHeader .feed-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9bc08a;
            animation: pulse 1.4s infinite;
        }
        #feedList {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
            scrollbar-width: thin;
        }
        .feed-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 7px 12px;
            border-bottom: 1px dashed rgba(94, 44, 44, 0.25);
        }
        .feed-avatar-box {
            position: relative;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }
        .feed-avatar {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1.5px solid #5e2c2c;
            display: block;
            background: #fdfdfb;
        }
        .feed-letter {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfb;
            color: #5e2c2c;
            font-size: 13px;
            font-weight: 900;
            border: 1.5px solid #5e2c2c;
        }
        .feed-body {
            min-width: 0;
            flex: 1;
            line-height: 1.3;
        }
        .feed-name {
            font-size: 10px;
            font-weight: 800;
            color: #8a5a5a;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Courier New', Courier, monospace;
        }
        .feed-text {
            font-size: 14px;
            color: #5e2c2c;
            word-break: break-word;
            font-family: Georgia, 'Times New Roman', 'STSong', 'SimSun', serif;
        }

        /* ===== 全新弹幕卡片 — 报纸头条 ===== */
        .danmaku-card {
            position: fixed;
            top: -400px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            max-width: 480px;
            min-width: 240px;
            background: #fdfdfb;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            border: 2.5px solid #5e2c2c;
            box-shadow: 7px 7px 0 #5e2c2c;
            pointer-events: none;
            user-select: none;
            will-change: top;
            padding: 0;
            overflow: hidden;
        }
        .danmaku-card.dc-enter {
            animation: dc-slide-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .danmaku-card.dc-leave {
            animation: dc-slide-out 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes dc-slide-in {
            from { top: -400px; }
            to { top: 80px; }
        }
        @keyframes dc-slide-out {
            from { top: 80px; }
            to { top: -400px; }
        }

        /* 纸张纹理 — 微妙晕染 */
        .danmaku-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse at 22% 18%, rgba(160, 120, 60, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 82%, rgba(180, 130, 80, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(44, 58, 94, 0.020) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* 顶栏 — 通栏深蓝报头 */
        .dc-header {
            display: flex;
            align-items: stretch;
            gap: 0;
            padding: 0;
            background: #5e2c2c;
            border-bottom: none;
            position: relative;
            z-index: 1;
        }
        .dc-header::after {
            content: '';
            display: none;
        }
        .dc-avatar {
            width: 54px;
            height: 54px;
            border-radius: 0;
            background: #fdfdfb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 26px;
            color: #5e2c2c;
            flex-shrink: 0;
            box-shadow: none;
            position: relative;
            overflow: hidden;
            font-family: Georgia, 'Times New Roman', serif;
            border-right: 2px solid #5e2c2c;
        }
        .dc-avatar-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 0;
            object-fit: cover;
            display: block;
            background: #fdfdfb;
            filter: saturate(0.95) brightness(1.05) contrast(0.95);
        }
        .dc-userinfo {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            line-height: 1.15;
            flex: 1;
            min-width: 0;
            padding: 6px 14px;
        }
        .dc-username {
            font-size: 16px;
            font-weight: 900;
            color: #fdfdfb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: none;
            font-family: Georgia, 'Times New Roman', serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .dc-username::before {
            content: '— ';
            color: #e8a4a4;
            font-weight: 900;
        }
        .dc-vol {
            margin-left: 0;
            width: 46px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fdfdfb;
            flex-shrink: 0;
            filter: none;
            border-left: 1px solid rgba(244, 230, 200, 0.30);
        }
        .dc-vol svg {
            width: 18px;
            height: 18px;
            fill: #fdfdfb;
        }

        /* 消息主体 — 报纸大字标题 + 粉色引号 */
        .dc-body {
            padding: 26px 32px 28px 34px;
            color: #5e2c2c;
            font-size: 26px;
            font-weight: 700;
            font-style: normal;
            text-align: left;
            line-height: 1.35;
            word-break: break-word;
            white-space: normal;
            max-width: 100%;
            background: #fdfdfb;
            text-shadow: none;
            letter-spacing: 0;
            font-family: 'Times New Roman', Georgia, 'STSong', 'SimSun', serif;
            position: relative;
            z-index: 1;
        }
        .dc-body::before {
            content: '\201C';
            position: absolute;
            top: 4px;
            left: 10px;
            font-size: 62px;
            color: #e8a4a4;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 900;
            line-height: 1;
            z-index: 0;
            pointer-events: none;
        }
        .dc-body::after {
            content: '\201D';
            color: #e8a4a4;
            font-weight: 900;
            font-size: 26px;
        }

        /* 底部 — 版权页脚 */
        .dc-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px;
            background: #5e2c2c;
            backdrop-filter: none;
            border-top: none;
            color: #fdfdfb;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            gap: 8px;
            flex-wrap: wrap;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
        .dc-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: #e8a4a4;
            opacity: 0.75;
        }
        .dc-footer-left, .dc-footer-right {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 1;
        }
        .dc-footer svg {
            width: 12px;
            height: 12px;
            fill: #fdfdfb;
            flex-shrink: 0;
            filter: none;
        }
        .dc-cheered {
            opacity: 1;
            font-weight: 700;
            color: #e8a4a4;
        }

        /* 响应式微调 */
        @media (max-width: 600px) {
            .danmaku-card {
                max-width: 90vw;
                min-width: 200px;
                border-width: 2px;
                box-shadow: 5px 5px 0 #5e2c2c;
            }
            .dc-body {
                font-size: 21px;
                padding: 22px 24px 24px 26px;
            }
            .dc-body::before {
                font-size: 50px;
            }
            .dc-footer {
                padding: 7px 14px;
                font-size: 9px;
                letter-spacing: 1.5px;
            }
            .input-area {
                width: 92%;
                box-shadow: 4px 4px 0 #5e2c2c;
            }
            #feedPanel {
                width: 170px;
                left: 8px;
                box-shadow: 4px 4px 0 #5e2c2c;
            }
        }
        @media (max-width: 400px) {
            .danmaku-card {
                max-width: 94vw;
                min-width: 160px;
                box-shadow: 4px 4px 0 #5e2c2c;
            }
            .dc-body {
                font-size: 18px;
                padding: 18px 20px 20px 22px;
            }
            .dc-body::before {
                font-size: 42px;
                top: 2px;
            }
            .dc-username {
                font-size: 14px;
                letter-spacing: 1px;
            }
            .dc-avatar {
                width: 46px;
                height: 46px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中...</span>
    </div>
    <div id="feedPanel">
        <div id="feedHeader"><span class="feed-dot"></span><span>实时弹幕</span></div>
        <div id="feedList"></div>
    </div>
    <div id="danmakuContainer"></div>

    <script>
        const container = document.getElementById('danmakuContainer');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const feedList = document.getElementById('feedList');
        let isShowing = false;
        const MAX_FEED_ITEMS = 60;

        // 图标 (与之前完全一致)
        const ICON_VOL = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06A7 7 0 0 1 19 12a7 7 0 0 1-5 6.71v2.06A9 9 0 0 0 21 12 9 9 0 0 0 14 3.23z"/></svg>';
        const ICON_BIT = '<svg viewBox="0 0 24 24"><path d="M12 2 4 8v8l8 6 8-6V8l-8-6zm0 2.3 5.8 4.35v6.7L12 19.7 6.2 15.35v-6.7L12 4.3zM12 7l-3 3 3 3 3-3-3-3z"/></svg>';

        function setStatus(connected) {
            if (connected) {
                statusDot.className = 'status-dot ok';
                statusText.textContent = '已连接直播间';
            } else {
                statusDot.className = 'status-dot bad';
                statusText.textContent = '弹幕未连接';
            }
        }

        // ----- 左侧实时弹幕流 -----
        function addFeedItem(msg) {
            const name = msg.username || '匿名';
            const hasAvatar = !!msg.avatar;
            const avatarHtml =
                `<span class="feed-avatar-box">
                    <span class="feed-letter">${escapeHtml((name[0] || 'D').toUpperCase())}</span>
                    <img class="feed-avatar" src="${escapeHtml(msg.avatar)}" alt="" loading="lazy"
                         ${hasAvatar ? '' : 'style="display:none;"'}
                         onerror="this.style.display='none'">
                </span>`;
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.dataset.uid = String(msg.uid || '');
            item.innerHTML =
                `${avatarHtml}<div class="feed-body">
                    <div class="feed-name">${escapeHtml(name)}</div>
                    <div class="feed-text">${escapeHtml(msg.text)}</div>
                </div>`;
            feedList.appendChild(item);
            while (feedList.children.length > MAX_FEED_ITEMS) {
                feedList.removeChild(feedList.firstChild);
            }
            feedList.scrollTop = feedList.scrollHeight;
        }

        // ----- 创建弹幕卡片 (重构样式，逻辑完全保留) -----
        function createDanmaku(text, opts) {
            if (isShowing) return;
            if (!text || text.trim() === '') return;
            isShowing = true;
            opts = opts || {};

            const name = opts.username || 'D';
            const hasAvatar = !!opts.avatar;

            const avatarHtml =
                `<img class="dc-avatar-img" src="${escapeHtml(opts.avatar)}" alt=""
                     loading="eager" decoding="async" fetchpriority="high"
                     style="position:absolute;inset:0;width:100%;height:100%;border-radius:0;object-fit:cover;display:block;background:#fdfdfb;filter:saturate(0.95) brightness(1.05) contrast(0.95);${hasAvatar ? '' : 'visibility:hidden;'}"
                     ${hasAvatar ? 'onerror="this.remove()"' : ''}>` +
                `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;color:#5e2c2c;">${escapeHtml(name[0].toUpperCase())}</span>`;

            const card = document.createElement('div');
            card.className = 'danmaku-card';
            card.dataset.uid = String(opts.uid || '');
            card.innerHTML = `
                <div class="dc-header">
                    <div class="dc-avatar" style="position:relative;overflow:hidden;">${avatarHtml}</div>
                    <div class="dc-userinfo">
                        <div class="dc-username">${escapeHtml(name)}</div>
                    </div>
                    <div class="dc-vol">${ICON_VOL}</div>
                </div>
                <div class="dc-body">${escapeHtml(text)}</div>
                <div class="dc-footer">
                    <div class="dc-footer-left">${ICON_BIT}<span>B站弹幕</span></div>
                    <div class="dc-footer-right"><span class="dc-cheered">来自直播间</span></div>
                </div>
            `;
            container.appendChild(card);
            card.classList.add('dc-enter');

            setTimeout(() => {
                card.classList.remove('dc-enter');
                card.classList.add('dc-leave');
                setTimeout(() => {
                    if (card.parentNode) {
                        card.remove();
                    }
                    isShowing = false;
                }, 900);
            }, 3200);
        }

        function setAvatar(uid, url) {
            if (!uid || !url) return;
            document.querySelectorAll(`[data-uid="${uid}"] .feed-avatar, .danmaku-card[data-uid="${uid}"] .dc-avatar-img`)
                .forEach(img => {
                    img.src = url;
                    img.style.display = 'block';
                    img.style.visibility = 'visible';
                });
        }

        function escapeHtml(s) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
                '/': '&#x2F;'
            };
            return String(s).replace(/[&<>"'/]/g, c => map[c] || c);
        }

        // ----- SSE 接入 (完全保留) -----
        const SSE_URL = (location.protocol === 'file:')
            ? 'http://127.0.0.1:8766/events'
            : '/events';

        function connectSSE() {
            const es = new EventSource(SSE_URL);
            es.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch { return; }
                if (msg.type === 'danmaku') {
                    // 左侧实时流：所有弹幕
                    addFeedItem(msg);
                } else if (msg.type === 'reply') {
                    // 中央卡片：只展示被选中回复的弹幕
                    createDanmaku(msg.text, {
                        username: msg.username,
                        avatar: msg.avatar,
                        uid: msg.uid,
                    });
                } else if (msg.type === 'avatar') {
                    setAvatar(msg.uid, msg.avatar);
                } else if (msg.type === 'status') {
                    setStatus(msg.connected);
                }
            };
            es.onerror = () => {
                statusDot.className = 'status-dot bad';
                statusText.textContent = '与服务器断开';
            };
        }

        connectSSE();
    </script>
</body>
</html>
