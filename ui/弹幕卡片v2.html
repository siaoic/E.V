<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>多类型弹幕效果｜参考 1.css</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
:root {
    --ink: rgba(255, 255, 255, 0.98);
    --ink-soft: rgba(255, 255, 255, 0.94);
    --line: rgba(255, 255, 255, 0.56);
    --veil: rgba(0, 0, 0, 0.5);
    /* ✅ 与 1.css 保持一致的文字阴影（更柔和的两层渐变阴影） */
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.98), 0 3px 10px rgba(0, 0, 0, 0.88);
    /* 优化9：Windows 用户常缺思源宋体，补本地衬线后备链 */
    --font: "XiaoKeNaiLaoTiShangYongMianFei", "Source Han Serif CN", "Source Han Serif SC",
            "Noto Serif SC", "Songti SC", "SimSun", "MingLiU", "PMingLiU", serif;
    --push-speed: 260ms;
    --enter-speed: 340ms;
    --leave-speed: 260ms;         /* 离场动画 */
    --msg-gap: 26px;

    /* 外层：弹幕容器 ↔ 浏览器网页 上下间距相等
       ⚠️ 严格要求"容器顶 ↔ 网页顶" == "容器底 ↔ 网页底"：
          外距只保留单一变量 --viewport-gap，body 对称 padding
          内距必须上下对称 --inner-padding-v
          因此消息顶到网页顶 = viewport-gap + inner-padding-v
               消息底到网页底 = viewport-gap + inner-padding-v
          两者恒等，不会再出现下松上紧 */
    --viewport-gap: 50px;

    /* 内层：消息 ↔ 弹幕容器内部（上下对称） */
    --inner-padding-v: 24px;      /* 24px 既不贴边也不空 */
    --inner-padding-h: 18px;
}
*{
    box-sizing:border-box;
    font-family:var(--font)!important;
    margin:0;
    padding:0;
}
html,body{
    background:transparent;
    overflow:hidden !important;
    height: 100vh;
    width: 100vw;               /* 防止横向 scrollbar 引起 body 实际高度偏移 */
}
body{
    /* ✅ height 单独写 100vh，不再重复 min-height，避免浏览器在有 padding + overflow:hidden 时
       把 height 计算为 auto 导致 flex-item 高度拉不满，容器上下留白不均 */
    height: 100vh;
    padding: var(--viewport-gap) 16px;
    display:flex;
    align-items: stretch;        /* 强制子元素 (chat-container) 垂直贴满 body padding-box */
    justify-content: flex-start; /* 水平左对齐，配合容器 max-width 居左，不让 flex center 引入水平位移 */
    flex-direction: column;
    box-sizing: border-box;
}
.chat-container{
    /* 用 flex:1 1 auto 替代 height:100%：
       height:100% 在部分浏览器里会参考 body content-box (不含padding) 计算，
       导致 chat-container 实际比 body padding-box 短一段，底部留白就比顶部大。
       flex:1 + align-items:stretch 保证上下严格贴 body padding。 */
    width:100%;
    max-width:980px;
    flex: 1 1 auto;
    min-height: 0;
    background: transparent !important;
    backdrop-filter: none !important;
    border: none !important;
    border-radius: 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
#msgWrapper{
    flex:1;
    position:relative;
    width:auto;
    max-width:780px;
    /* 严格对称：上下均为 --inner-padding-v，保证 消息顶-视口顶 == 消息底-视口底 */
    padding: var(--inner-padding-v) var(--inner-padding-h);
    overflow:hidden;
}
/*
  ✅ 修复重叠：
  - 旧代码：布局定位 (translateY) 与入场动画 (translateY) 同时操作 transform，互斥覆盖导致错位
  - 新方案：.msg-item 用 top 做绝对布局（从下往上挤压、配合 top 的 transition 平滑滑动）
           .msg-item-inner 负责入场动画（独立节点，不污染布局定位）
*/
.msg-item{
    position:absolute;
    left:0;
    right:0;
    top:0;                         /* 初始位置，由 JS 通过 top 精确定位 */
    transition: top var(--push-speed) cubic-bezier(0.16, 0.77, 0.3, 1),
                opacity var(--leave-speed) ease-out;
    will-change: top, opacity;
    backface-visibility:hidden;
}
/* 优化2：离场类 → 超界先淡再移除，替代"突然消失" */
.msg-item.msg-leaving{
    opacity: 0 !important;
    transform: translateY(-14px) translateZ(0);
    transition: opacity var(--leave-speed) ease-out,
                transform var(--leave-speed) cubic-bezier(0.16, 0.77, 0.3, 1) !important;
    pointer-events: none;
}
/* 入场动画放在内层，与布局属性 top 完全分离 */
@keyframes msg-enter-inner {
    from { opacity: 0; transform: translateY(36px) translateZ(0); }
    to   { opacity: 1; transform: translateY(0)    translateZ(0); }
}
.msg-item-inner{
    width:100%;
    animation: msg-enter-inner var(--enter-speed) cubic-bezier(0.22, 0.8, 0.3, 1) both;
    will-change: transform, opacity;
    backface-visibility: hidden;
}
/* 优化8：最新一条脉冲光晕（1.5s 内轻微发光吸引视线） */
.msg-item.msg-latest .msg-item-inner::after{
    content:"";
    position:absolute;
    right:-4px;
    top:50%;
    transform:translateY(-50%);
    width:6px;height:6px;border-radius:50%;
    background: radial-gradient(circle, #fff, rgba(255,255,255,0.0) 70%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 0 12px rgba(255,255,255,0.7);
    animation: latest-pulse 1500ms ease-out both;
    pointer-events:none;
}
.msg-item.msg-latest .msg-item-inner{ position: relative; }
@keyframes latest-pulse{
    0%   { opacity: 0; transform: translate(6px, -50%) scale(0.5); }
    20%  { opacity: 1; transform: translate(0,  -50%) scale(1);   }
    100% { opacity: 0; transform: translate(-10px,-50%) scale(0.8); }
}

/* ======================= 通用动画（与 1.css 对齐） ======================= */
@keyframes inkline-enter {
    from { opacity: 0; transform: translateX(16px) translateZ(0); }
    to   { opacity: 1; transform: translateX(0) translateZ(0); }
}
@keyframes inkline-avatar-enter {
    from { opacity: 0; transform: translateX(-9px) scale(0.84) translateZ(0); }
    to   { opacity: 1; transform: translateX(0) scale(1) translateZ(0); }
}
@keyframes inkline-reveal {
    from { opacity: 0; transform: scaleX(0) translateZ(0); }
    to   { opacity: 1; transform: scaleX(1) translateZ(0); }
}
@keyframes crew-card-strong-in {
    from { opacity:0; transform:translateY(24px) scale(0.94) translateZ(0); }
    to   { opacity:1; transform:translateY(0) scale(1) translateZ(0); }
}
@keyframes crew-avatar-strong-in {
    from { opacity:0; transform:translateY(-26px) rotate(-10deg) scale(0.52) translateZ(0); }
    to   { opacity:1; transform:translateY(0) rotate(0) scale(1) translateZ(0); }
}
@keyframes crew-wing-strong-in {
    from { opacity:0; transform:scaleX(0) translateZ(0); }
    to   { opacity:1; transform:scaleX(1) translateZ(0); }
}
@keyframes crew-ring-in {
    from { opacity:0; transform:scale(0.68) translateZ(0); }
    to   { opacity:1; transform:scale(1) translateZ(0); }
}
@keyframes crew-name-in {
    from { opacity:0; transform:translateY(8px) translateZ(0); }
    to   { opacity:1; transform:translateY(0) translateZ(0); }
}
@keyframes crew-rank-strong-in {
    from { opacity:0; transform:scale(0.55) translateZ(0); }
    to   { opacity:1; transform:scale(1) translateZ(0); }
}
@keyframes crew-status-in {
    from { opacity:0; transform:translateY(6px) translateZ(0); }
    to   { opacity:1; transform:translateY(0) translateZ(0); }
}

/* ========== 头像通用 ========== */
.avatar-wrap{
    position:relative;
    border-radius:50%;
    transform: translateZ(0);
    backface-visibility:hidden;
}
.avatar-inner{
    border-radius:50%;
    overflow:hidden;
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    transform: translateZ(0);
    backface-visibility:hidden;
}
.avatar-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform: translateZ(0);
    backface-visibility:hidden;
    border-radius:50%;
}

/* =========================================================
   类型 1：普通文字弹幕 msg-text
   对应 1.css -> yt-live-chat-text-message-renderer
   ========================================================= */
.msg-text {
    display:block !important;
    margin:0 !important;
    overflow:visible !important;
    background:transparent !important;
    width:auto;
    max-width:calc(100vw - 24px);
}
.msg-text .card{
    display:flex !important;
    align-items:flex-start !important;
    width:auto !important;
    max-width:100%;
    padding:0 !important;
    overflow:visible !important;
    background:transparent !important;
}
/* 头像：50×50，带边框 + outline（1.css 最终版效果） */
.msg-text .author-photo{
    display:block !important;
    flex:0 0 50px !important;
    width:50px !important;
    height:50px !important;
    min-width:50px !important;
    margin:4px 17px 0 0 !important;
    overflow:visible !important;
    background: transparent !important;
    animation: inkline-avatar-enter 230ms ease-out both !important;
}
.msg-text .author-photo .avatar-wrap{
    width:100%;height:100%;
    background:transparent;
    padding:0;
}
.msg-text .author-photo .avatar-inner img{
    border: 1px solid rgba(255,255,255,0.92) !important;
    outline: 1px solid rgba(255,255,255,0.44) !important;
    outline-offset: 3px !important;
}

.msg-text .content{
    position:relative !important;
    display:inline-flex !important;
    flex:0 1 auto !important;
    flex-direction:column !important;
    align-items:flex-start !important;
    width:auto !important;
    min-width:154px;            /* 与 1.css 对齐 */
    max-width:520px;
    margin:0 !important;
    padding:8px 14px 11px !important;
    overflow:visible !important;
    border-left:1px solid rgba(255,255,255,0.58)!important;
    /* ✅ 与 1.css 保持一致：0.5 → 0.26 → 0.1 的渐变透明度 */
    background:linear-gradient(90deg,rgba(0,0,0,0.5),rgba(0,0,0,0.26)72%,rgba(0,0,0,0.1))!important;
    box-shadow:none !important;
    animation:inkline-enter 250ms cubic-bezier(0.2,0.75,0.3,1) 30ms both !important;
}
.msg-text .content::before{
    content:"";position:absolute;top:0;left:0;width:38px;height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,0.84),transparent);
    transform-origin:left center;
    animation:inkline-reveal 330ms ease-out 140ms both;
}
.msg-text .author-chip{
    display:inline-flex !important;
    align-items:center !important;
    width:auto !important;
    max-width:100% !important;
    margin:0 0 3px !important;
    padding:0 !important;
    overflow:visible !important;
    background:transparent !important;
}
.msg-text .author-name{
    display:inline-block !important;
    min-width:0 !important;
    max-width:440px !important;
    overflow:hidden !important;
    color:var(--ink-soft)!important;
    font-size:14.5pt !important;
    font-weight:600 !important;
    line-height:1.28 !important;
    letter-spacing:0 !important;           /* 1.css 显式指定 0 */
    text-overflow:ellipsis !important;
    white-space:nowrap !important;
    text-shadow:var(--shadow)!important;
}
.msg-text .message{
    min-width:0 !important;
    max-width:100% !important;
    margin:0 !important;
    padding:0 !important;
    color:var(--ink)!important;
    font-size:22pt !important;
    font-weight:540 !important;
    line-height:1.42 !important;
    letter-spacing:0 !important;           /* 1.css 显式指定 0 */
    overflow-wrap:break-word !important;
    word-wrap:break-word !important;
    word-break:normal !important;
    text-shadow:var(--shadow)!important;
}

/* =========================================================
   类型 2：会员弹幕 msg-member（privilege-3/2/1）
   对应 1.css -> yt-live-chat-text-message-renderer[author-type="member"][privilegetype="N"]
   ========================================================= */
.msg-member {
    display:block !important;
    margin:0 !important;
    overflow:visible !important;
    background:transparent !important;
    width:auto;
    max-width:calc(100vw - 24px);
}
/* 变量：不同特权等级 → 不同 rail/echo/weight（与 1.css 一致） */
.msg-member.privilege-3 { --rail: 96px; --echo: 0; --weight: 0.68; }
.msg-member.privilege-2 { --rail: 58px; --echo: 4px; --weight: 0.82; }
.msg-member.privilege-1 { --rail: 94px; --echo: 7px; --weight: 0.96; }

.msg-member .card{
    display:flex !important;
    align-items:flex-start !important;
    width:auto !important;
    max-width:100%;
    padding:0 !important;
    overflow:visible !important;
    background:transparent !important;
}
.msg-member .author-photo{
    display:block !important;
    flex:0 0 50px !important;
    width:50px !important;
    height:50px !important;
    min-width:50px !important;
    margin:4px 17px 0 0 !important;
    overflow:visible !important;
    background: transparent !important;
    animation: inkline-avatar-enter 230ms ease-out both !important;
}
.msg-member .author-photo .avatar-wrap{ width:100%;height:100%; background:transparent; padding:0; }
.msg-member .author-photo .avatar-inner img{
    border-radius:50% !important;
    border: 1px solid rgba(255,255,255,0.92) !important;
    outline: 2px solid rgba(255,255,255,0.78) !important;
    outline-offset: 4px !important;
}
/* 特权等级更细的头像描边（与 1.css 完全一致） */
.msg-member.privilege-2 .author-photo .avatar-inner img{
    outline-width: 3px !important;
    outline-offset: 6px !important;
}
.msg-member.privilege-1 .author-photo .avatar-inner img{
    outline: 2px solid rgba(255,255,255,0.94) !important;
    box-shadow: 0 0 0 5px rgba(255,255,255,0.27) !important;
}

.msg-member .content{
    position:relative !important;
    display:inline-flex !important;
    flex:0 1 auto !important;
    flex-direction:column !important;
    align-items:flex-start !important;
    width:auto !important;
    min-width:154px;
    max-width:520px;
    margin:0 !important;
    overflow:visible !important;
    /* 基础轮廓：与 1.css 最终的会员基础样式一致 */
    padding-left: 17px !important;
    padding:8px 14px 11px 17px !important;
    border: 1px solid rgba(255,255,255,var(--weight)) !important;
    border-left: 3px solid rgba(255,255,255,0.98) !important;
    outline: 1px solid rgba(255,255,255,0.28) !important;
    outline-offset: var(--echo) !important;
    background: linear-gradient(90deg,rgba(0,0,0,0.29),rgba(0,0,0,0.08)64%,transparent) !important;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22) !important;
    animation:inkline-enter 250ms cubic-bezier(0.2,0.75,0.3,1) 30ms both !important;
}
.msg-member .content::before{
    content:"";position:absolute;top:0;left:0;width:var(--rail);height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,0.98),transparent);
    transform-origin:left center;
    animation:inkline-reveal 330ms ease-out 140ms both;
}

/* privilege-3（舰长）：左2px + 底部1px 单线  顶部96px亮线 */
.msg-member.privilege-3 .content{
    padding: 9px 15px 12px 17px !important;
    border: 0 !important;
    border-left: 2px solid rgba(255,255,255,0.92) !important;
    border-bottom: 1px solid rgba(255,255,255,0.58) !important;
    outline: 0 !important;
    background:linear-gradient(90deg,rgba(0,0,0,0.52),rgba(0,0,0,0.28)70%,rgba(0,0,0,0.1))!important;
    box-shadow: none !important;
}
.msg-member.privilege-3 .content::before{
    content:"" !important; top:0 !important; left:0 !important;
    width:96px !important; height:1px !important;
    background:linear-gradient(90deg,rgba(255,255,255,0.92),transparent)!important;
}
.msg-member.privilege-3 .author-photo .avatar-inner img{
    box-shadow: 0 0 0 1px rgba(255,255,255,0.64) !important;
}

/* privilege-2（提督）：双线边框 + 左侧竖线 + 顶部装饰缺口（带左右短竖线） */
.msg-member.privilege-2 .content{
    padding: 10px 17px 13px 21px !important;
    border: 1px solid rgba(255,255,255,0.74) !important;
    border-left: 3px double rgba(255,255,255,0.96) !important;
    outline: 0 !important;
    background:linear-gradient(90deg,rgba(0,0,0,0.56),rgba(0,0,0,0.3)72%,rgba(0,0,0,0.11))!important;
    box-shadow: inset 0 -4px 0 -3px rgba(255,255,255,0.36) !important;
}
.msg-member.privilege-2 .content::before{
    content:"" !important; top:7px !important; bottom:7px !important; left:7px !important;
    width:1px !important; height:auto !important;
    background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.72),transparent)!important;
    transform:none; animation:none; transform-origin:center; opacity:1;
}
.msg-member.privilege-2 .content::after{
    content:"" !important; position:absolute !important; top:-4px !important; right:16px !important;
    display:block !important; width:58px !important; height:7px !important;
    border-left:1px solid rgba(255,255,255,0.62)!important;
    border-right:1px solid rgba(255,255,255,0.62)!important;
    background:transparent !important;
}
.msg-member.privilege-2 .author-photo .avatar-inner img{
    box-shadow: 0 0 0 1px rgba(255,255,255,0.88),0 0 0 4px rgba(0,0,0,0.34),0 0 0 5px rgba(255,255,255,0.48) !important;
}

/* privilege-1（总督）：双线外框 + 四角 ✦ 标记 */
.msg-member.privilege-1 .content{
    padding: 13px 21px 16px !important;
    border: 1px solid rgba(255,255,255,0.96) !important;
    outline: 0 !important;
    background:linear-gradient(90deg,rgba(0,0,0,0.62),rgba(0,0,0,0.34)62%,rgba(0,0,0,0.12))!important;
    box-shadow: inset 0 0 0 4px rgba(0,0,0,0.2),inset 0 0 0 5px rgba(255,255,255,0.34) !important;
}
.msg-member.privilege-1 .content::before,
.msg-member.privilege-1 .content::after{
    position:absolute !important; display:block !important; width:auto !important; height:auto !important;
    color:rgba(255,255,255,0.94)!important; background:transparent !important;
    font-size:11px !important; line-height:1 !important; text-shadow:var(--shadow)!important;
    transform:none; animation:none;
}
.msg-member.privilege-1 .content::before{ content:"✦" !important; top:-6px !important; left:18px !important; }
.msg-member.privilege-1 .content::after{  content:"✦" !important; right:18px !important; bottom:-6px !important; }
.msg-member.privilege-1 .author-photo .avatar-inner img{
    box-shadow: 0 0 0 1px rgba(255,255,255,0.96),0 0 0 4px rgba(0,0,0,0.4),0 0 0 5px rgba(255,255,255,0.72),0 0 0 8px rgba(0,0,0,0.26),0 0 0 9px rgba(255,255,255,0.32) !important;
}

.msg-member .author-chip{
    display:inline-flex !important;
    align-items:center !important;
    width:auto !important;
    max-width:100% !important;
    margin:0 0 3px !important;
    padding:0 !important;
    overflow:visible !important;
    background:transparent !important;
}
.msg-member .author-name{
    display:inline-block !important;
    min-width:0 !important;
    max-width:440px !important;
    overflow:hidden !important;
    color:var(--ink-soft)!important;
    font-size:14.5pt !important;
    font-weight:600 !important;
    line-height:1.28 !important;
    letter-spacing:0 !important;
    text-overflow:ellipsis !important;
    white-space:nowrap !important;
    text-shadow:var(--shadow)!important;
}
.msg-member .message{
    min-width:0 !important;
    max-width:100% !important;
    margin:0 !important;
    padding:0 !important;
    color:var(--ink)!important;
    font-size:22pt !important;
    font-weight:540 !important;
    line-height:1.42 !important;
    letter-spacing:0 !important;
    overflow-wrap:break-word !important;
    word-wrap:break-word !important;
    word-break:normal !important;
    text-shadow:var(--shadow)!important;
}
/* 会员作者 chip 右侧的等级标识（与 1.css 一致） */
.msg-member .author-chip::after{
    flex:0 0 auto !important;width:auto !important;height:auto !important;margin-left:5px !important;
    background:transparent !important;color:rgba(255,255,255,0.82)!important;
    font-family:var(--font)!important;font-size:8.5pt !important;font-weight:700 !important;
    line-height:1 !important;letter-spacing:0.12em !important;text-shadow:var(--shadow)!important;
}
.msg-member.privilege-3 .author-chip::after{ content:"III"!important; padding-left:7px !important; border-left:1px solid rgba(255,255,255,0.48)!important; }
.msg-member.privilege-2 .author-chip::after{ content:"II"!important;  padding:2px 6px !important; border:1px solid rgba(255,255,255,0.58)!important; }
.msg-member.privilege-1 .author-chip::after{ content:"✦ I ✦"!important; padding:2px 7px !important; border-top:1px solid rgba(255,255,255,0.62)!important; border-bottom:1px solid rgba(255,255,255,0.34)!important; }

/* =========================================================
   类型 3：付费弹幕 / SC  msg-paid
   对应 1.css -> yt-live-chat-paid-message-renderer
   ========================================================= */

<body>
<div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">连接中...</span>
</div>
<div class="chat-container">
    <div id="msgWrapper"></div>
</div>
<div id="danmakuContainer"></div>

<script>
/* =====================================================================
 *  优化 3/6：集中脚本区
 *  - 入列错峰队列（FIFO 严格顺序，不插队）：密集到达按 340ms 匀开
 *  - relayout 合并到每一帧：同帧多条变化只重排一次
 *  - 坐标系统一：高度用 offsetHeight（容器内高度），避免 getBoundingClientRect 视口坐标回写 style.top 造成偏移
 *  - 图片 404 兜底 / id 合法区间 / 懒加载
 * ===================================================================== */
const wrapper = document.getElementById('msgWrapper');
const MAX_MSG_COUNT = 20;
const LEAVE_ANIM_MS = 260;                  // 与 --leave-speed 同步
const MIN_ENQUEUE_INTERVAL = 340;           // 错峰匀开的最小间隔（ms）

const rootStyle = getComputedStyle(document.documentElement);
const MSG_GAP        = parseFloat(rootStyle.getPropertyValue('--msg-gap'))          || 26;
/* 内距现在上下完全对称，读同一个变量，兜底 24px */
const WRAP_PAD_V     = parseFloat(rootStyle.getPropertyValue('--inner-padding-v'))  || 24;
const WRAP_PAD_TOP   = WRAP_PAD_V;
const WRAP_PAD_BOTTOM= WRAP_PAD_V;

const msgList = [];   // [0]最旧(顶) ... [n-1]最新(底)   ✅ 严格按到达顺序，永不插队

/* -------------------- 优化 3：FIFO 入列队列（密集时匀开 340ms/条） -------------------- */
const pendingQueue = [];      // 等待插入的 HTML 字符串（保持到达先后）
let enqueueTimer = null;
let lastEnqueueAt = 0;
function enqueue(htmlStr){
    pendingQueue.push(htmlStr);
    _flushPending(true);
}
function _flushPending(scheduled){
    if(!pendingQueue.length) return;
    const now = performance.now();
    const wait = Math.max(0, MIN_ENQUEUE_INTERVAL - (now - lastEnqueueAt));
    if(wait <= 1 || !scheduled){
        lastEnqueueAt = performance.now();
        const html = pendingQueue.shift();
        _addNewMessageInternal(html);
        if(pendingQueue.length){
            enqueueTimer = setTimeout(()=>_flushPending(false), MIN_ENQUEUE_INTERVAL);
        }
    } else {
        if(enqueueTimer) return;   // 已排
        enqueueTimer = setTimeout(()=>{
            enqueueTimer = null;
            _flushPending(false);
        }, wait);
    }
}

/* -------------------- 优化 6：relayout 每帧合并 -------------------- */
let relayoutRafId = 0;
function scheduleRelayout(){
    if(relayoutRafId) return;
    relayoutRafId = requestAnimationFrame(()=>{
        relayoutRafId = 0;
        relayout();
    });
}

/* -------------------- 优化 d：布局（容器坐标、每帧一次） -------------------- */
function relayout(){
    // 1) 尺寸更新：只对还未记录高度或发生 reflow 的条目刷新高度（用 offsetHeight，容器坐标）
    for(const item of msgList){
        if(!item.height) item.height = item.dom.offsetHeight;
    }

    // 2) 从"最旧→最新"按顺序堆叠：旧消息在上，最新在下（贴底部安全线）
    //    用从底向上的逆序布局保证最新的永远贴 bottomY
    const wrapH = wrapper.clientHeight;            // 容器内高（不含 border，但 msgWrapper 无 border）
    const bottomY = wrapH - WRAP_PAD_BOTTOM;
    let cursorY = bottomY;
    for(let i = msgList.length - 1; i >= 0; i--){
        const item = msgList[i];
        cursorY -= item.height;
        item.y = cursorY;
        item.dom.style.top = item.y + 'px';
        cursorY -= MSG_GAP;
    }

    // 3) 最新脉冲光晕：只给最后一条挂 class（.msg-latest）
    for(let i = 0; i < msgList.length; i++){
        const isLast = (i === msgList.length - 1);
        const el = msgList[i].dom;
        if(isLast) el.classList.add('msg-latest');
        else       el.classList.remove('msg-latest');
    }

    // 4) 移除：数量超限 或 顶部完全越过 WRAP_PAD_TOP
    const innerTop = WRAP_PAD_TOP;
    while(msgList.length){
        const head = msgList[0];
        const overCount = msgList.length > MAX_MSG_COUNT;
        const overTop   = (head.y + head.height) < innerTop;
        if(!overCount && !overTop) break;
        _removeWithFade(head);
        msgList.shift();
    }
}

/* -------------------- 优化 2：离场 fade + 上漂 -------------------- */
function _removeWithFade(item){
    if(item._leaving) return;
    item._leaving = true;
    const el = item.dom;
    el.classList.add('msg-leaving');
    setTimeout(()=>{
        try{ el.remove(); }catch(_){}
    }, LEAVE_ANIM_MS + 20);
}

/* -------------------- 内部插入（真正挂 DOM、排到 msgList 尾） -------------------- */
function _addNewMessageInternal(htmlStr){
    // 外层负责布局定位(top)，内层负责入场动画（完全解耦）
    const outer = document.createElement('div');
    outer.className = 'msg-item';

    const inner = document.createElement('div');
    inner.className = 'msg-item-inner';
    inner.innerHTML = htmlStr.trim();
    outer.appendChild(inner);
    wrapper.appendChild(outer);

    // 预插入位置：容器底部之下（不可见区域），保证 offsetHeight 正确
    outer.style.visibility = 'hidden';
    const preTop = wrapper.clientHeight + 40;
    outer.style.top = preTop + 'px';

    // 下一帧读取真实高度（此时图片若未加载会偏小，图片 onload 后再补发一次 relayout）
    requestAnimationFrame(()=>{
        const h = outer.offsetHeight;
        outer.style.visibility = '';
        msgList.push({ dom: outer, height: h, y: 0 });
        scheduleRelayout();
        // 图片加载完后，可能撑高容器（如果图片未用固定尺寸）— 再重排一次
        const imgs = outer.querySelectorAll('img');
        let pending = imgs.length;
        if(pending){
            const onImgReady = ()=>{
                if(--pending === 0){
                    const nh = outer.offsetHeight;
                    if(nh !== h){
                        // 找到对应条目刷新高度
                        const rec = msgList.find(m => m.dom === outer);
                        if(rec){ rec.height = nh; scheduleRelayout(); }
                    }
                }
            };
            imgs.forEach(img=>{
                if(img.complete){ onImgReady(); }
                else { img.addEventListener('load', onImgReady, { once:true });
                       img.addEventListener('error', onImgReady, { once:true }); }
            });
        }
    });
}

/* ========== 统一入口（严格 FIFO 顺序，不插队） ==========
   旧 push(type) 入口已下线：它会调用 randName/randText 主动向列表塞入虚构数据。

     - window.__pushDanmaku__(payload)  通过 SSE 事件线程调用（SSE → connectSSE）
     - enqueue(htmlStr) / addNewMessage(htmlStr)  只接受已构造好的真实 HTML（不生成假字段）

*/
function push(/* type */){
    const msg = '[弹幕] push(type) 已禁用：本地无参模板（会产生虚构用户名/内容）已下线。'
              + '请通过 connectSSE() 连真实 B 站直播间，或直接调用 window.__pushDanmaku__(payload) 注入真实结构数据。';
    console.error(msg);
    try { if (window && typeof window.alert !== 'undefined') {} } catch(e) {}
    return undefined;
}
// 对外暴露的接入点（接真实 blivedm/B 站直播流只要调这个函数）
window.__pushDanmaku__ = function(payload){
    /* payload: { type, uid?, name?, text?, level?, avatar?, amount? }
       type:  'text' | 'member' | 'member-3' | 'member-2' | 'member-1'
            | 'paid' | 'crew'   | 'crew-3'   | 'crew-2'   | 'crew-1'
       level: 当 type 为 'member'/'crew' 时可传 3/2/1 简写，会拼为 'member-3' / 'crew-2'
       avatar: 支持两种 —— 字符串 URL（直接用，B 站直播接口返回的真实头像） 或 纯数字（走 picsum 占位图）
       amount: SC 类必填，形如 '￥100' / '￥500' */
    if(!payload || !payload.type) return;

    /* 1) 归一化 type：member/crew + level 简写 -> member-3 / crew-2 这种 tplFromData 识别的格式 */
    let normType = String(payload.type);
    if((normType === 'member' || normType === 'crew') && (payload.level === 1 || payload.level === 2 || payload.level === 3)){
        normType = normType + '-' + payload.level;
    }

    /* 2) 构造与 REAL_DANMAKUS 同结构的 d 记录，直通 tplFromData —— 不再修改全局 SAMPLE_* 数组 */
    const d = {
        uid:    payload.uid    != null ? payload.uid    : (Date.now() ^ (Math.random()*0x7FFFFFFF)|0),
        name:   payload.name   != null ? payload.name   : '',
        text:   payload.text   != null ? payload.text   : '',
        amount: payload.amount != null ? payload.amount : '',
        type:   normType,
    };

    /* 3) 头像分发：http(s) 开头 → 直接填 avatarUrl（外部真实来源）；纯数字 → 填 avatarId（picsum 占位） */
    const av = payload.avatar;
    if(typeof av === 'string' && /^https?:\/\//i.test(av)){
        d.avatarUrl = av;
    } else if(typeof av === 'number' || (typeof av === 'string' && /^\d+$/.test(av))){
        d.avatarId = Number(av);
    }
    /* 两者都没传时，模板内自行 randId() 兜底 */

    enqueue(tplFromData(d));
};

/* =====================================================================
   弹幕评分 + 候选池（前端模拟后端 picker.py 的逻辑）
   - 自动演示模式下：每条弹幕评分进池，8s 窗口后挑最高分显示中央卡片
   - SSE 真实模式下：后端 picker 已选好，通过 reply 消息直接推送
   评分规则与 picker.py 对齐：长度 + 热词命中 - 灌水词扣分，0~100
   ===================================================================== */
const _HOT_TOKENS = ["主播","up","UP","喂","在吗","在不在","听得到","看得见",
    "吗","呢","？","?","怎么","为什么","什么","哪","谁","几",
    "！","!","哇","草","绝","神","笑死","好可爱","好帅","喜欢","爱","想你","亲"];
const _BORING_TOKENS = ["666","233","hhh","哈哈哈","哈哈","来了","打卡","签到",
    "1","2","3","a","s","d","f","q","w","e","r","t","y","。。",".."];
const _BORING_RE = /^(哈|啊|哦|嗯|6|2|h|w)+$/;
const _HAS_CONTENT_RE = /[A-Za-z0-9\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/;
const _PICK_WINDOW_MS = 8000;
const _PICK_MIN_SCORE = 20;
const _PICK_POOL_MAX = 50;
const _PICK_COOLDOWN_MIN = 10000;
const _PICK_COOLDOWN_MAX = 15000;
const _danmakuPool = [];
let _pickTimer = null;
let _lastPickAt = 0;

function scoreDanmaku(text) {
    if (!text || text.length <= 1 || _BORING_RE.test(text)) return 0;
    if (_BORING_TOKENS.indexOf(text) >= 0) return 0;
    if (!_HAS_CONTENT_RE.test(text)) return 0;
    let score = 10;
    if (text.length >= 15) score += 15;
    else if (text.length >= 8) score += 8;
    let hotHits = 0;
    for (let i = 0; i < _HOT_TOKENS.length; i++) {
        if (text.indexOf(_HOT_TOKENS[i]) >= 0) {
            hotHits++;
            if (hotHits >= 3) break;
        }
    }
    score += hotHits * 12;
    const last = text.charAt(text.length - 1);
    if (last === '？' || last === '?') score += 3;
    else if (last === '！' || last === '!') score += 2;
    else if (last === '~' || last === '～') score += 1;
    let boringHits = 0;
    for (let i = 0; i < _BORING_TOKENS.length; i++) {
        if (text.indexOf(_BORING_TOKENS[i]) >= 0) boringHits++;
    }
    score -= boringHits * 8;
    return Math.max(0, Math.min(100, score));
}

function submitToPool(d) {
    if (!d || !d.text) return;
    const score = scoreDanmaku(d.text);
    if (score < _PICK_MIN_SCORE) return;
    _danmakuPool.push({ uid: d.uid, name: d.name, text: d.text,
        avatarId: d.avatarId, avatarUrl: d.avatarUrl,
        score: score, at: Date.now() });
    if (_danmakuPool.length > _PICK_POOL_MAX) _danmakuPool.shift();
}

function _pickBestFromPool() {
    const now = Date.now();
    if (now - _lastPickAt < _PICK_COOLDOWN_MIN) return;
    const cutoff = now - _PICK_WINDOW_MS * 2;
    while (_danmakuPool.length && _danmakuPool[0].at < cutoff) _danmakuPool.shift();
    const windowCutoff = now - _PICK_WINDOW_MS;
    const candidates = _danmakuPool.filter(d => d.at >= windowCutoff);
    if (!candidates.length) return;
    candidates.sort((a, b) => b.score - a.score || b.at - a.at);
    const best = candidates[0];
    const idx = _danmakuPool.indexOf(best);
    if (idx >= 0) _danmakuPool.splice(idx, 1);
    _lastPickAt = now;
    const avatarSrc = best.avatarUrl ? best.avatarUrl
        : (best.avatarId != null ? avatar(best.avatarId) : '');
    createDanmaku(best.text, {
        username: best.name || '匿名',
        avatar: avatarSrc,
        uid: best.uid,
        tag: '精 选 弹 幕',
    });
}

function startAutoPicker() {
    if (_pickTimer) return;
    _pickTimer = setInterval(_pickBestFromPool, 2000);
}
function stopAutoPicker() {
    if (_pickTimer) { clearInterval(_pickTimer); _pickTimer = null; }
}

function createDanmaku(text, opts) {
    if (dcIsShowing) return;
    if (!text || String(text).trim() === '') return;
    dcIsShowing = true;
    opts = opts || {};
    const name = opts.username || opts.name || 'D';
    const hasAvatar = !!opts.avatar;

    const card = document.createElement('div');
    card.className = 'danmaku-card';
    card.dataset.uid = String(opts.uid || '');
    const score = opts.score != null ? opts.score : null;
    const tag = opts.tag || (score != null ? `精 选 · ${score}分` : '醒 目 留 言');
    const avatarImg = hasAvatar
        ? `<img class="dc-avatar-img" src="${escapeHtml(opts.avatar)}" alt="" loading="eager" decoding="async" fetchpriority="high" onerror="this.style.display='none';">`
        : '';
    card.innerHTML = `
        <div class="dc-card">
            <div class="dc-header">
                <div class="dc-avatar">
                    ${avatarImg}
                    <span class="dc-avatar-letter">${escapeHtml((name[0] || 'D').toUpperCase())}</span>
                </div>
                <div class="dc-userinfo">
                    <div class="dc-username">${escapeHtml(name)}</div>
                    <div class="dc-tag">${escapeHtml(tag)}</div>
                </div>
            </div>
            <div class="dc-body">${escapeHtml(text)}</div>
        </div>
    `;
    danmakuContainer.appendChild(card);
    card.classList.add('dc-enter');
    setTimeout(() => {
        card.classList.remove('dc-enter');
        card.classList.add('dc-leave');
        setTimeout(() => {
            if (card.parentNode) card.remove();
            dcIsShowing = false;
        }, 900);
    }, 3200);
}

/* ========== 自动演示：已移除本地剧本。实时弹幕唯一来源为 SSE。 ========== */
let autoTimer = null;
/* autoOn 默认关闭：无本地模拟数据，不再自动定时注入剧本。 */
let autoOn = false;
/* 保留空壳实现，避免外部/历史引用报错。剧本数据已删除，请依赖 connectSSE()。 */
function startDanmakuAuto(/* intervalMs = 2600 */){
    autoOn = false;
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
    /* 无本地剧本可播放，直接返回；真实弹幕请通过 connectSSE() 接入。 */
}
function stopDanmakuAuto(){
    autoOn = false;
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
}
window.stopDanmakuAuto  = stopDanmakuAuto;
window.startDanmakuAuto = startDanmakuAuto;

/* 移除 REAL_DANMAKUS 预播循环 / setTimeout 延迟启动 / startAutoPicker 自动调用。
   改为仅在 connectSSE() 成功后，由后端实时推送驱动。 */

/* 兜底：窗口尺寸变化时，重新测量每条高度并重排（防抖 80ms） */
let _resizeT = null;
window.addEventListener('resize', ()=>{
    clearTimeout(_resizeT);
    _resizeT = setTimeout(()=>{
        for(const item of msgList){
            // 用 offsetHeight 避免视口坐标回写绝对定位的偏移问题
            item.height = item.dom.offsetHeight;
        }
        scheduleRelayout();
    }, 80);
}, { passive: true });

/* 兜底：如果样式全部加载完再重排一次（避免 Google Fonts 首帧字体宽度变化 → 换行导致高度误差 → 溢出重叠） */
if(document.fonts && typeof document.fonts.ready === 'object' && typeof document.fonts.ready.then === 'function'){
    document.fonts.ready.then(()=>{
        for(const item of msgList){ item.height = item.dom.offsetHeight; }
        scheduleRelayout();
    }).catch(()=>{});
} else {
    window.addEventListener('load', ()=>scheduleRelayout(), { once:true, passive:true });
}

/* =====================================================================
   SSE 实时接入（对接 ev/danmaku 后端真实数据）
   - 页面带 ?room_id=X 时订阅指定房间，否则默认主房间
   - danmaku    → privilege_type>0 走会员边框 (member)，否则普通 text
   - superchat  → SC 醒目留言 (paid)，带 ￥ 金额
   - guard      → 大航海入列 (crew)，支持 toast 附言
   - reply      → 后端 picker 精选弹幕 → 中央卡片
   - avatar     → setAvatar 异步补全头像
   - status     → 同步右上角 status-bar
   - 收到第一条真实消息后自动停止 REAL_DANMAKUS 离线演示
   ===================================================================== */
const ROOM_ID = new URLSearchParams(location.search).get('room_id') || '';
const ROOM_QUERY = ROOM_ID ? ('?room_id=' + encodeURIComponent(ROOM_ID)) : '';
const SSE_URL = (location.protocol === 'file:')
    ? 'http://127.0.0.1:8766/events' + ROOM_QUERY
    : '/events' + ROOM_QUERY;

/* ---- 状态指示 DOM ---- */
let statusDot  = document.getElementById('statusDot');
let statusText = document.getElementById('statusText');
function setStatus(ok, text){
    if(!statusDot) statusDot = document.getElementById('statusDot');
    if(!statusText) statusText = document.getElementById('statusText');
    if(statusDot)  statusDot.className  = 'status-dot ' + (ok ? 'ok' : 'bad');
    if(statusText && text) statusText.textContent = text;
}

/* ---- 收到真实数据后统一行为：停离线演示 ---- */
function _switchToLiveMode(){
    if(autoOn){ stopDanmakuAuto(); autoOn = false; }
    stopAutoPicker();
}

/* ---- SSE 连接句柄（useOfflineDemo 时可主动 close） ---- */
window.__sse_es__ = null;

function connectSSE() {
    let es;
    try { es = new EventSource(SSE_URL); } catch(e) { return; }
    window.__sse_es__ = es;

    es.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        if (msg.type === 'danmaku') {
            _switchToLiveMode();
            const priv = msg.privilege_type || 0;
            window.__pushDanmaku__({
                type:      priv ? 'member' : 'text',
                level:     priv,
                uid:       msg.uid,
                /* 兼容多后端字段：client.py 默认用 username，模拟后端/其他后端可能用 name */
                name:      msg.username != null ? msg.username : msg.name,
                text:      msg.text,
                avatar:    msg.avatar,
                avatarUrl: msg.avatar,
                avatarId:  msg.avatarId != null ? msg.avatarId : undefined,
            });

        } else if (msg.type === 'superchat') {
            _switchToLiveMode();
            window.__pushDanmaku__({
                type:      'paid',
                uid:       msg.uid,
                name:      msg.username != null ? msg.username : msg.name,
                text:      msg.text,
                avatar:    msg.avatar,
                avatarUrl: msg.avatar,
                avatarId:  msg.avatarId != null ? msg.avatarId : undefined,
                amount:    msg.amount || ('￥' + (msg.price || 0)),
            });

        } else if (msg.type === 'guard') {
            _switchToLiveMode();
            /* level 兼容：client.py 发 guard_level；其他后端可能发 level */
            const gLevel = (msg.guard_level === 1 || msg.guard_level === 2 || msg.guard_level === 3)
                ? msg.guard_level
                : ((msg.level === 1 || msg.level === 2 || msg.level === 3) ? msg.level : 3);
            window.__pushDanmaku__({
                type:      'crew',
                level:     gLevel,
                uid:       msg.uid,
                name:      msg.username != null ? msg.username : msg.name,
                text:      msg.text,          /* toast 附言 */
                avatar:    msg.avatar,
                avatarUrl: msg.avatar,
                avatarId:  msg.avatarId != null ? msg.avatarId : undefined,
            });

        } else if (msg.type === 'reply') {
            /* 后端 picker 精选 → 中央卡片 */
            createDanmaku(msg.text, {
                username: msg.username != null ? msg.username : msg.name,
                avatar:   msg.avatar,
                uid:      msg.uid,
                tag:      '精 选 弹 幕',
            });

        } else if (msg.type === 'avatar') {
            setAvatar(msg.uid, msg.avatar);

        } else if (msg.type === 'status') {
            /* connected / ok 两个字段都兼容（不同后端字段） */
            const connected = (msg.connected === true) || (msg.ok === true);
            if (connected) {
                setStatus(true, msg.msg || '已连接直播间');
                _switchToLiveMode();
            } else {
                setStatus(false, msg.msg || '连接断开');
            }
        }
        /* heartbeat：后端 15s 保活，忽略 */
    };

    es.onerror = () => {
        setStatus(false, '与服务器断开');
        /* 移除：SSE 断开后不再回退到本地剧本（已删除）。
           如需重连，请在浏览器控制台执行 connectSSE() 或 stopOfflineDemo()。 */
    };
}

/* ---- 手动切离线演示：关闭 SSE，仅切换状态栏显示（无本地剧本可播放）。---- */
function useOfflineDemo() {
    window.__offline_forced__ = true;
    if(window.__sse_es__){
        try { window.__sse_es__.close(); } catch(e){}
        window.__sse_es__ = null;
    }
    setStatus(false, '离线演示模式');
    /* 移除：REAL_DANMAKUS 剧本与 startDanmakuAuto/startAutoPicker 自动播放均已删除。
       如需真实弹幕，请调用 stopOfflineDemo() 以重连 SSE。 */
}
window.useOfflineDemo  = useOfflineDemo;
window.stopOfflineDemo = function(){
    window.__offline_forced__ = false;
    connectSSE();
};

connectSSE();
</script>
</body>
