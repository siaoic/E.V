<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>E.V 在线字幕</title>
<style>
  @font-face {
    font-family: "SubtitleEN";
    src: url("/font/en.ttf") format("truetype");
  }
  @font-face {
    font-family: "SubtitleCN";
    src: url("/font/cn.ttf") format("truetype");
    /* 仅 CJK 统一表意区 + 中文标点命中中文字体，其余用 ArtierEN-2 */
    unicode-range: U+2000-206F, U+3000-303F, U+4E00-9FFF, U+FF00-FFEF;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* 透明背景：可叠加在直播软件/OBS 浏览器源上 */
    background: transparent;
    overflow: hidden;
  }
  body {
    /* 垂直居中靠底部（对齐桌宠模式气泡在模型下方的位置感） */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 8vh;
  }

  #userline {
    /* 观众弹幕 / 用户发言：独立一行，小于 AI 字幕、略透明以作区分 */
    font-family: "SubtitleEN", "SubtitleCN", sans-serif;
    font-size: 20px;
    line-height: 1.4;
    color: #ffe9a8;
    text-shadow:
      0 1px 3px rgba(0,0,0,0.8),
      0 0 10px rgba(0,0,0,0.5);
    max-width: 70vw;
    text-align: center;
    word-break: break-word;
    margin-bottom: 8px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #userline.visible {
    opacity: 1;
    transition: opacity 0.20s ease;
  }
  #userline.fading {
    opacity: 0;
    transition: opacity 0.80s ease;
  }

  #subtitle {
    /* 中英文字体：先命中 SubtitleEN（兜底 sans-serif），
       再由 unicode-range 把 CJK 字符路由到 SubtitleCN */
    font-family: "SubtitleEN", "SubtitleCN", sans-serif;
    font-size: 28px;
    line-height: 1.45;
    color: #ffffff;
    /* 柔和文字阴影：保证在亮色/透明背景上清晰可读（替代实体背景） */
    text-shadow:
      0 1px 3px rgba(0,0,0,0.75),
      0 0 12px rgba(0,0,0,0.45);
    max-width: 80vw;
    text-align: center;
    word-break: break-word;
    white-space: pre-wrap;
    padding: 10px 20px;
    border-radius: 14px;
    /* 透明背景：无边框无实色填充，仅靠阴影+描边样式可读 */
    background: transparent;
    /* 不透明度 + 过渡动画：显示淡入、清除时淡出 */
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  #subtitle.visible {
    opacity: 1;
    transition: opacity 0.20s ease;
  }
  #subtitle.fading {
    opacity: 0;
    transition: opacity 0.60s ease;
  }
</style>
</head>
<body>
  <div id="userline"></div>
  <div id="subtitle"></div>
  <div id="conn">字幕连接已断开，重连中…</div>

<script>
(function () {
  const sub = document.getElementById('subtitle');
  const userline = document.getElementById('userline');
  const conn = document.getElementById('conn');
  const url = location.origin + '/events';

  /* 断线自动重连：指数退避（初始 1s，上限 10s） */
  let reconnectTimer = null;
  let reconnectDelay = 1000;

  function connect() {
    const es = new EventSource(url);

    // 重连成功：清除断线提示，重置退避
    es.onopen = () => {
      reconnectDelay = 1000;
      conn.classList.remove('visible');
    };

    function show(text) {
      sub.textContent = text;
      if (!text) {
        // 空文本：进入淡出（clear 时）
        sub.classList.remove('visible');
        sub.classList.add('fading');
        return;
      }
      sub.classList.remove('fading');
      sub.classList.add('visible');
    }

    es.addEventListener('text', (e) => {
      // 打字机累积文本：只显示、不自动隐藏——句间合成间隙可达数秒，
      // 自动淡出会让字幕在回复中途消失又出现（闪烁）
      show(e.data);
    });

    // 观众弹幕 / 用户发言：单独一行展示，3 秒后自动淡出（不遮挡 AI 字幕）
    let userFadeTimer = null;
    es.addEventListener('user', (e) => {
      if (!e.data) return;
      userline.textContent = e.data;
      userline.classList.remove('fading');
      userline.classList.add('visible');
      clearTimeout(userFadeTimer);
      userFadeTimer = setTimeout(() => {
        userline.classList.remove('visible');
        userline.classList.add('fading');
      }, 3000);
    });

    es.addEventListener('clear', () => {
      // 回复真正结束才淡出（文字保留到淡出完成，由 CSS 过渡平滑隐藏）
      sub.classList.remove('visible');
      sub.classList.add('fading');
    });

    es.onerror = () => {
      // 断线：淡出当前字幕 + 显示灰色重连提示；
      // 主动关闭（接管 EventSource 原生重试），按指数退避自动重连
      sub.classList.remove('visible');
      sub.classList.add('fading');
      conn.classList.add('visible');
      try { es.close(); } catch (e) {}
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };
  }

  connect();
})();
</script>
</body>
</html>
