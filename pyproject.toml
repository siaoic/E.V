[project]
name = "vtuber"
dynamic = ["version"]
description = "AI 虚拟主播运行时：智谱 AI × VTubeStudio，支持情绪感知、口型同步与实时面部驱动"
readme = "README.md"
requires-python = ">=3.10.0, <3.14"
dependencies = [
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
    "mcp>=2.0.0",
]
authors = [
    { name = "vtuber" },
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ui*", "plugins*", "tools*"]