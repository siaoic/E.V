# ===== 运行模式（vtuber / pet） =====
# RUN_MODE: "vtuber"

# ===== 桌宠模式 =====
# PET_MODEL_PATH: ""
# PET_WINDOW_SIZE: ""
# PET_ALWAYS_ON_TOP: true
# PET_MOTION_PATH: ""
# PET_IDLE_MOTION: ""

