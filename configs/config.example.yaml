# E.V 分层配置模板（可选）
#
# 用法：复制本文件为 configs/config.yaml，按需取消注释修改。
# 优先级：环境变量 > config.yaml > 默认值。
#   - 环境变量（.env）已设置的字段，yaml 不覆盖（环境变量永远优先）；
#   - 所有字段均可省略，省略即用默认值（与不配 yaml 时行为完全一致）；
#   - 配置项全量说明见 docs/config.md。
# 注意：.env 仍建议保留 LLM_API_KEY 等密钥；yaml 用于「非密钥、按环境差异化」
# 的配置（如直播间 / 运行参数），避免每次改配置都改 .env。

# ===== LLM（OpenAI 兼容接口） =====
# LLM_API_KEY: ""
# LLM_BASE_URL: ""
# LLM_MODEL: "glm-4.7-flash"
# LLM_THINKING: true

# ===== VTubeStudio =====
# VTS_PORT: 8001
# VTS_PLUGIN_NAME: "ZhipuAI_VTuber"
# VTS_PLUGIN_DEVELOPER: "LocalUser"
# MOTION_PATH: ""
# VTS_ROOT: ""
# VTS_IDLE_TAKEOVER: true

# ===== 口型同步 =====
# MOUTH_PARAMETER: ""
# MOUTH_GAIN: 0.4

# ===== GPT-SoVITS TTS =====
# TTS_SERVER_URL: "http://127.0.0.1:8000"
# TTS_OUTPUT_DEVICE: "Voicemeeter In"   # 低延迟输出设备名子串（WASAPI 独占）；留空用系统默认
# GPTSOVITS_REF_AUDIO: ""
# GPTSOVITS_REF_AUDIOS: ""
# GPTSOVITS_PROMPT_TEXT: ""
# GPTSOVITS_TIMEOUT: 120
# GPTSOVITS_MODELS_DIR: "tools/gsv_tts/API/models"

# ===== 内容过滤 =====
# PROFANITY_FILTER_ENABLED: true
# PROFANITY_FILTER_RATE: 0.7

# ===== 记忆系统 =====
# MEMORY_ENABLED: true
# Mem0 判决链：新提取事实由 LLM 判定 ADD/UPDATE/DELETE/IGNORE，
# 防止近似重复入库与事实冲突。默认关闭（现有语义去重路径不变）。
# MEMORY_LIFECYCLE_ENABLED: false
# MEMORY_LIFECYCLE_MODEL: ""            # 留空用 BUTLER_MODEL / LLM_MODEL
# MEMORY_LIFECYCLE_THRESHOLD: 0.6       # 相似记忆召回阈值（低于视为全新主题直接 ADD）

# ===== ButlerAgent 管家模型（留空 = 与主对话共用） =====
# BUTLER_BASE_URL: ""
# BUTLER_API_KEY: ""
# BUTLER_MODEL: ""
# SESSION_SUMMARIZE_MODEL: ""
# BUTLER_THINKING: false

# ===== 人设（SYSTEM_PROMPT_FILE 优先于 yaml/UI 人设） =====
# SYSTEM_PROMPT_FILE: ""
# SYSTEM_PROMPT: ""

# ===== 知识库（防幻觉：data/knowledge 权威设定按信号闸门命中才注入） =====
# KNOWLEDGE_ENABLED: true
# KNOWLEDGE_MAX_CHARS: 1200   # 单次知识注入的字符预算（闲聊不注入，省 Token）

# ===== Agent 任务执行（阶段 4，默认不启用，!agent 命令触发） =====
# AGENT_ENABLED: false
# AGENT_MODEL: ""             # 留空用 LLM_MODEL
# AGENT_MAX_STEPS: 8
# AGENT_MAX_TOKENS: 50000
# AGENT_WORKSPACE: ""         # 留空 = 项目根（Agent 只能在此目录内读写）
# AGENT_ALLOW_SHELL: false    # shell 高风险操作门禁，默认拒绝

# ===== Function Calling 工具 =====
# OPENWEATHERMAP_API_KEY: ""
# TOOLS_ENABLED: true
# TOOL_GET_CURRENT_TIME_ENABLED: true
# TOOL_GET_WEATHER_ENABLED: true
# TOOL_LOAD_SKILL_ENABLED: true
# TOOL_LOOK_SCREEN_ENABLED: true
# TOOL_PLAY_SFX_ENABLED: true

# ===== 自我进化 =====
# EVOLUTION_ENABLED: true
# EVOLUTION_MIN_INTERVAL: 600
# EVOLUTION_MIN_TURNS: 10
# EVOLUTION_PERIODIC_INTERVAL: 1800
# EVOLUTION_EVAL_ENABLED: true
# EVOLUTION_EVAL_CASES: 2
# EVOLUTION_PROMPT_EVO_ENABLED: true
# EVOLUTION_PROMPT_EVO_INTERVAL: 21600

# ===== 模型路由进化 =====
# LLM_SERVERS: ""
# LLM_ROUTER_ENABLED: true
# LLM_ROUTER_EPSILON: 0.1

# ===== MCP =====
# MCP_ENABLED: false
# MCP_CONFIG_PATH: "src/mcp/mcp_config.json"

# ===== 外部服务（mindcraft） =====
# MINDCRAFT_PATH: "plugins/mindcraft"
# MINDCRAFT_LLM_BASE_URL: ""
# MINDCRAFT_LLM_MODEL: "glm-4-flash-250414"
# MINDCRAFT_BOT_NAME: "vtuber"
# MINDCRAFT_HOST: "127.0.0.1"
# MINDCRAFT_PORT: 55916
# MINDCRAFT_AUTH: "offline"
# MINDCRAFT_MINDSERVER_PORT: 8080
# MINDCRAFT_BRIDGE_ENABLED: false
# MINDCRAFT_BOT_PERSONA: ""

# ===== 运行参数与并发控制 =====
# HISTORY_ROUNDS: 10
# LLM_MAX_CONCURRENCY: 2
# PROACTIVE_QUEUE_MAX: 4
# AGENT_AVOID_MAIN_LLM: true
# AGENT_HISTORY_SNAPSHOT: 6
# AGENT_DUP_THRESHOLD: 0.85

# ===== 主动对话 =====
# PROACTIVE_ENABLED: true
# RESPONSE_INTERVAL_MIN: 5
# RESPONSE_INTERVAL_MAX: 10

# ===== 技能系统 =====
